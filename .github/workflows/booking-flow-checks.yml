name: Booking flow checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  booking-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test-only DOM dependency
        run: npm install --prefix "$RUNNER_TEMP/otgg-test-deps" --no-audit --no-fund --save=false jsdom@26
      - name: Check browser script syntax
        run: |
          node --check booking.js
          node --check booking-date.js
          node --check nav.js
          node --check site-analytics.js
          node --check netlify/functions/track-site-analytics.js
      - name: Test the booking and date-step DOM
        run: NODE_PATH="$RUNNER_TEMP/otgg-test-deps/node_modules" node tests/booking-flow.cjs
      - name: Test integrated calendar and venue flow
        run: NODE_PATH="$RUNNER_TEMP/otgg-test-deps/node_modules" node tests/unified-date-checker.cjs
      - name: Test November automatic mini golf offer
        run: NODE_PATH="$RUNNER_TEMP/otgg-test-deps/node_modules" node tests/automatic-offer.cjs
      - name: Check automatic-offer endpoint syntax
        run: node --check netlify/functions/automatic-offer-status.js
      - name: Test BIRDIE30 returning popup and November banner
        run: NODE_PATH="$RUNNER_TEMP/otgg-test-deps/node_modules" node tests/birdie30-campaign.cjs
      - name: Validate returning-offer API syntax
        run: node --check netlify/functions/track-returning-offer.js
      - name: Test returning-offer tracking endpoint
        run: node tests/returning-offer-tracking.cjs
      - name: Test unified booking analytics and consent
        run: NODE_PATH="$RUNNER_TEMP/otgg-test-deps/node_modules" node tests/site-analytics-v2.cjs
      - name: Test booking endpoint transport
        run: node tests/booking-endpoints.cjs
