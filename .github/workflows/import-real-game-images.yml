name: Import real game images

on:
  push:
    branches:
      - real-game-images
    paths:
      - .github/workflows/import-real-game-images.yml

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: real-game-images

      - name: Download primary WebP assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images
          curl -LfsS 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-62b4-8210-bee5-23d018117a5c/raw?se=2026-10-06T19%3A17%3A01Z&sp=r&sv=2026-02-06&sr=b&scid=c6cdb11c-8006-5828-a74e-0d8d341222dd&skoid=6658dbdd-f305-4d30-8f6b-d62218202cb9&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T08%3A49%3A41Z&ske=2026-10-07T08%3A49%3A41Z&sks=b&skv=2026-02-06&sig=CZKlmFIFTKC3%2BX3l03NqGVnimHBLJWzvI%2BxV0fYDlyM%3D' -o assets/images/giant-connect-four-game-1.webp
          curl -LfsS 'https://sdmntprukwest.oaiusercontent.com/files/00000000-7984-8243-a3a6-d727af047b39/raw?se=2026-10-06T19%3A17%3A27Z&sp=r&sv=2026-02-06&sr=b&scid=7ff787e2-d987-506d-b56e-4c58fc1d0b62&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T06%3A23%3A09Z&ske=2026-10-07T06%3A23%3A09Z&sks=b&skv=2026-02-06&sig=ep3G22/P6LuA5tOoNPfzbSNtbVVaK6SDay0emU1dn3s%3D' -o assets/images/giant-noughts-and-crosses-game-1.webp
          curl -LfsS 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-3afc-8210-a0c2-5ff986d4b91b/raw?se=2026-10-06T19%3A17%3A49Z&sp=r&sv=2026-02-06&sr=b&scid=94a4d8df-01ab-59c7-bce6-f0f9d5ac17bf&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T07%3A28%3A26Z&ske=2026-10-07T07%3A28%3A26Z&sks=b&skv=2026-02-06&sig=94B074o9fbETyzfJnOf2FQd6ympfrIDf20W9YGCojqs%3D' -o assets/images/giant-tumbling-blocks-game-1.webp
          curl -LfsS 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-53b8-8210-a0e8-3873d0fe867e/raw?se=2026-10-06T19%3A18%3A14Z&sp=r&sv=2026-02-06&sr=b&scid=ed471bec-6394-54fd-8988-6d99168d10a0&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T07%3A08%3A36Z&ske=2026-10-07T07%3A08%3A36Z&sks=b&skv=2026-02-06&sig=9efGngOBIf75biR7LRUPci0znXq/LHEPREYSc%2BqjFFs%3D' -o assets/images/giant-dominoes-game-1.webp
          curl -LfsS 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-184c-81f4-9f76-a0854b17cdbd/raw?se=2026-10-06T19%3A18%3A42Z&sp=r&sv=2026-02-06&sr=b&scid=7ada6592-660a-5d12-9bb7-3015da3afcc2&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T04%3A53%3A08Z&ske=2026-10-07T04%3A53%3A08Z&sks=b&skv=2026-02-06&sig=QNRmLTdfEQ7TP6ZeBeVjTdLbb26j0AkEg%2B30zE%2BUIVE%3D' -o assets/images/giant-ring-toss-game-1.webp
          curl -LfsS 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-3fa8-8210-aad7-6d16af4902c6/raw?se=2026-10-06T19%3A18%3A53Z&sp=r&sv=2026-02-06&sr=b&scid=10a2962f-b757-533c-beb4-a3cbb97137e1&skoid=6658dbdd-f305-4d30-8f6b-d62218202cb9&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T07%3A12%3A50Z&ske=2026-10-07T07%3A12%3A50Z&sks=b&skv=2026-02-06&sig=fIzTFkcUNfxQcwsR4YW5St0jgAEo3pAnycqjOT5VxME%3D' -o assets/images/giant-cornhole-game-1.webp
          test "$(find assets/images -maxdepth 1 -name 'giant-*-game-1.webp' | wc -l)" -eq 6

      - name: Commit image assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images/giant-*-game-1.webp
          git commit -m 'Add primary real game WebP assets'
          git push origin HEAD:real-game-images
