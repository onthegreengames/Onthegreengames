          curl -LfsS 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-2690-81f4-a7bf-68ebc714dd27/raw?se=2026-10-06T19%3A05%3A53Z&sp=r&sv=2026-02-06&sr=b&scid=869bd964-b2da-5d01-9fd4-a6e4f3732e55&skoid=6658dbdd-f305-4d30-8f6b-d62218202cb9&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T08%3A49%3A36Z&ske=2026-10-07T08%3A49%3A36Z&sks=b&skv=2026-02-06&sig=5RQ4yDm0KjYYA2IaTYMYyY4RoARgAU78WwHG5YytlpM%3D' -o assets/images/giant-noughts-and-crosses-game-1.webp
          curl -LfsS 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-8e78-8210-8134-178e656c9547/raw?se=2026-10-06T19%3A06%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=effdaa87-c955-5116-ac32-d2a8cbc0df2b&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T06%3A07%3A23Z&ske=2026-10-07T06%3A07%3A23Z&sks=b&skv=2026-02-06&sig=o4%2BKE%2BKneZephFujhQWR5%2BuY%2B89ODSxwoTvXzj9buf0%3D' -o assets/images/giant-noughts-and-crosses-game-2.webp
          curl -LfsS 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-c114-81f4-9ebf-ab1e89b50dae/raw?se=2026-10-06T19%3A06%3A42Z&sp=r&sv=2026-02-06&sr=b&scid=ed9f933f-da94-5fa0-87be-acf9306af4a4&skoid=6658dbdd-f305-4d30-8f6b-d62218202cb9&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T08%3A49%3A43Z&ske=2026-10-07T08%3A49%3A43Z&sks=b&skv=2026-02-06&sig=qMQ487uj%2BKc0jJh9nUnLCUoOXwwkeXFRzxvKXBf97sk%3D' -o assets/images/giant-tumbling-blocks-game-1.webp
          curl -LfsS 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-808c-8210-ab6f-c252065080f4/raw?se=2026-10-06T19%3A07%3A00Z&sp=r&sv=2026-02-06&sr=b&scid=f200249b-5f2f-54b9-ae12-395a41b6947a&skoid=82a3371f-2f6c-4f81-8a78-2701b362559b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T01%3A50%3A43Z&ske=2026-10-07T01%3A50%3A43Z&sks=b&skv=2026-02-06&sig=uFbJsG5o7SqJ/Ka0trLDB1fmJ6S9g7Gg2p30ZsNZvrU%3D' -o assets/images/giant-tumbling-blocks-game-2.webp
          curl -LfsS 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-22a4-8210-b7d0-475c86f3136f/raw?se=2026-10-06T19%3A07%3A24Z&sp=r&sv=2026-02-06&sr=b&scid=65782504-846c-5531-8c77-786f8d536a0c&skoid=0a4a0f0c-99ac-4752-9d87-cfac036fa93f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T18%3A58%3A21Z&ske=2026-10-07T18%3A58%3A21Z&sks=b&skv=2026-02-06&sig=SESQvR5H1bxX5uxwaUugIrumN1Iu9%2BqoZbRGPlUDARA%3D' -o assets/images/giant-dominoes-game-1.webp
          curl -LfsS 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-c4a4-8210-839e-dfa54bac3b4a/raw?se=2026-10-06T19%3A07%3A46Z&sp=r&sv=2026-02-06&sr=b&scid=4355e70b-a24b-53fb-bf83-5de2379a272d&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T08%3A24%3A48Z&ske=2026-10-07T08%3A24%3A48Z&sks=b&skv=2026-02-06&sig=544Ivz4j9amiK9UYRENyfpVdimcBaal4TIgAGzClPX0%3D' -o assets/images/giant-dominoes-game-2.webp
          curl -LfsS 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-dbe8-81f4-ba0e-35d79d61854c/raw?se=2026-10-06T19%3A08%3A05Z&sp=r&sv=2026-02-06&sr=b&scid=a1aa6780-19e1-5665-9bc1-a806a3a306b0&skoid=d4d17077-8f33-42a9-bd8b-aa9d5eaf5320&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T04%3A14%3A39Z&ske=2026-10-07T04%3A14%3A39Z&sks=b&skv=2026-02-06&sig=FJSZjcZ2ExXC4v%2BrzCpkExSFM03RTtF1u0qpk6jK/GE%3D' -o assets/images/giant-ring-toss-game-1.webp
          curl -LfsS 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-373c-81f4-b1dd-8d9cfaeb60f0/raw?se=2026-10-06T19%3A08%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=9d6890bc-6d7b-5be3-8707-365fee532ae6&skoid=0a4a0f0c-99ac-4752-9d87-cfac036fa93f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T07%3A07%3A08Z&ske=2026-10-07T07%3A07%3A08Z&sks=b&skv=2026-02-06&sig=fxAPNPRKOD3dDtP6Pa7f8rpQXuvZOCxBsSl%2Bj14pkDA%3D' -o assets/images/giant-ring-toss-game-2.webp
          curl -LfsS 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-60e8-8246-8afc-d8ce99217aaf/raw?se=2026-10-06T19%3A08%3A38Z&sp=r&sv=2026-02-06&sr=b&scid=82ef6b74-d767-506a-a397-1341ff90825e&skoid=82a3371f-2f6c-4f81-8a78-2701b362559b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T04%3A26%3A41Z&ske=2026-10-07T04%3A26%3A41Z&sks=b&skv=2026-02-06&sig=EBxyVNvmvUHQ%2Br3%2BpsUg%2BXTynBt9x/TWnuRSVsZflWQ%3D' -o assets/images/giant-cornhole-game-1.webp
          curl -LfsS 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-bdc0-8210-8d39-b324fc6fdbcd/raw?se=2026-10-06T19%3A09%3A00Z&sp=r&sv=2026-02-06&sr=b&scid=8bde1c29-a0a1-5558-af2e-9eec3c21ca97&skoid=d4d17077-8f33-42a9-bd8b-aa9d5eaf5320&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T06%3A20%3A45Z&ske=2026-10-07T06%3A20%3A45Z&sks=b&skv=2026-02-06&sig=q5T74MzoCmbdsXj6SOCdFow6BRcOi7gzSbiv7Hfixi8%3D' -o assets/images/giant-cornhole-game-2.webp
          test "$(find assets/images -maxdepth 1 -name 'giant-*-game-*.webp' | wc -l)" -eq 12

      - name: Commit image assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images/giant-*-game-*.webp
          git commit -m 'Add real game WebP assets'
          git push origin HEAD:real-game-images
