name: Import real game images

on:
  push:
    branches:
      - real-game-images
    paths:
      - .github/workflows/import-real-game-images.yml

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: real-game-images

      - name: Download optimized WebP assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images
          curl -LfsS 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-d608-8210-9b4e-18eb78746491/raw?se=2026-10-06T19%3A05%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=e8cb7282-bbe9-58dc-9961-ff2694615874&skoid=6658dbdd-f305-4d30-8f6b-d62218202cb9&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T07%3A49%3A17Z&ske=2026-10-07T07%3A49%3A17Z&sks=b&skv=2026-02-06&sig=fOlDMwgrbix9DT8Ew8mwt85/FxfO4RQtD2nT39hhSE0%3D' -o assets/images/giant-connect-four-game-1.webp
